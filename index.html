
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050505">

<title>AYKAY — First Drop 001</title>

<style>
@font-face {
  font-family: "Like A Rope";
  src: url("/fonts/like-a-rope.ttf") format("truetype");
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
  background: #050505;
}

body {
  color: #fff;
  font-family: Arial, sans-serif;
}

.page-shell {
  min-height: 100vh;
  min-height: 100svh;
  padding: 28px 22px 24px;
  display: flex;
  justify-content: center;

  /* FOOTBALL BACKGROUND */
  background-color: #050505;
  background-image:
    linear-gradient(
      rgba(0,0,0,.38),
      rgba(0,0,0,.48)
    ),
    url("/05FC0C80-90BF-4576-A227-3812A9C9B4B3.png");

  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: scroll;
}

.landing {
  width: 100%;
  max-width: 520px;
  min-height: calc(100svh - 52px);
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
}

/* FIRST DROP 001 */

.topline {
  width: 100%;
  padding: 12px 0;
  background: #000;
  color: #888;
  font: 10px monospace;
  letter-spacing: 4px;
  text-align: center;
  position: relative;
  z-index: 2;
}

/* BRAND AREA */

.brand-area {
  width: 100%;
  flex: 1;
  min-height: 300px;

  display: flex;
  align-items: flex-start;
  justify-content: center;

  padding: 0;
  position: relative;
}

/* SOLID BLACK BACKGROUND */

.brand-area::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 128px;
  background: #000;
  z-index: 0;
}

/* SIDE-BY-SIDE AYKAY LOGO */

.logo-stack {
  position: relative;
  z-index: 1;

  width: 100%;
  height: 64px;

  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  gap: 10px;

  background: transparent;
  border: none;
  padding: 0;
  white-space: nowrap;
}

.logo-background {
  position: static;
  color: #152b4c;
  font: 900 27px/1 Arial, sans-serif;
  letter-spacing: 2px;
  white-space: nowrap;
  opacity: .9;
}

.logo-foreground {
  position: static;
  color: #4385ed;
  font-family: "Like A Rope", cursive;
  font-size: 39px;
  line-height: 1;
  white-space: nowrap;
  text-shadow: 0 0 8px rgba(45,105,210,.2);
}

/* PROMOTIONAL MESSAGE */

.signup-intro {
  max-width: 340px;
  color: #ddd;
  font: 11px/1.9 monospace;
  letter-spacing: 2px;
  text-align: center;
  margin: 0 0 24px;
}

.discount-callout {
  color: #ed2929;
  font-weight: 900;
  white-space: nowrap;
}

/* SIGNUP FORM */

.signup-form {
  width: 100%;
  max-width: 340px;
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.signup-form input[type="email"],
.password-panel input {
  height: 48px;
  width: 100%;
  padding: 0 15px;
  background: #050505;
  border: 1px solid #333;
  color: white;
  font: 11px monospace;
  letter-spacing: 2px;
  outline: none;
}

.signup-form input::placeholder,
.password-panel input::placeholder {
  color: #777;
}

.signup-form input:focus,
.password-panel input:focus {
  border-color: #888;
}

/* CONSENT */

.consent-row {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  color: #777;
  font-size: 10px;
  line-height: 1.6;
}

.consent-row input {
  margin-top: 2px;
  accent-color: #e5cc39;
}

/* JOIN BUTTON */

.submit-button {
  height: 48px;
  background: #e5cc39;
  border: 0;
  color: #050505;
  font: 700 11px monospace;
  letter-spacing: 3px;
  cursor: pointer;
}

.submit-button:hover {
  background: #f3dc55;
}

.submit-button:disabled {
  opacity: .65;
  cursor: wait;
}

/* STATUS */

.status {
  color: #aaa;
  font-size: 11px;
  text-align: center;
}

/* HIDDEN FIELDS */

.website-field,
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0,0,0,0);
}

/* EARLY ACCESS */

.access-area {
  width: 100%;
  max-width: 340px;
  margin-top: 30px;
  text-align: center;
}

.password-toggle {
  background: none;
  border: 0;
  color: #777;
  font: 10px monospace;
  letter-spacing: 3px;
  cursor: pointer;
}

.toggle-mark {
  margin-left: 12px;
}

.password-panel {
  margin-top: 20px;
}

.password-panel p {
  color: #888;
  font-size: 11px;
}

.password-panel form {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.access-submit {
  height: 42px;
  background: transparent;
  border: 1px solid #444;
  color: white;
  font: 11px monospace;
  letter-spacing: 2px;
  cursor: pointer;
}

/* FOOTER */

.footer {
  width: 100%;
  display: flex;
  justify-content: flex-start;
  margin-top: 35px;
  padding-top: 25px;
  color: #555;
  font: 9px monospace;
  letter-spacing: 2px;
}

[hidden] {
  display: none !important;
}

/* MOBILE */

@media (max-width: 380px) {
  .logo-background {
    font-size: 24px;
  }

  .logo-foreground {
    font-size: 35px;
  }

  .logo-stack {
    gap: 7px;
  }
}

/* SHORT SCREENS */

@media (max-height: 650px) {
  .brand-area {
    min-height: 220px;
  }

  .brand-area::before {
    height: 110px;
  }

  .access-area {
    margin-top: 20px;
  }
}
</style>
</head>

<body>

<main class="page-shell">
<section class="landing">

  <div class="topline">
    FIRST DROP 001
  </div>

  <div class="brand-area">

    <div class="logo-stack">

      <span class="logo-background">AYKAY</span>

      <span class="logo-foreground">aykay</span>

    </div>

  </div>

  <p class="signup-intro">
    FIRST 100 SIGN UPS GET
    <span class="discount-callout">99%</span>
    <br>
    OFF FIRST DROP.
  </p>

  <form id="signup-form" class="signup-form" novalidate>

    <label class="sr-only" for="email">
      Email address
    </label>

    <input
      id="email"
      name="email"
      type="email"
      autocomplete="email"
      placeholder="EMAIL ADDRESS"
      maxlength="254"
      required>

    <div class="consent-row">

      <input
        id="consent"
        name="consent"
        type="checkbox"
        required>

      <label for="consent">
        I agree to receive AYKAY launch updates by email.
        I can unsubscribe at any time.
      </label>

    </div>

    <input
      class="website-field"
      type="text"
      name="website"
      tabindex="-1"
      autocomplete="off"
      aria-hidden="true">

    <button class="submit-button" type="submit">
      JOIN THE LIST
    </button>

    <p
      id="signup-status"
      class="status"
      role="status"
      aria-live="polite">
    </p>

  </form>

  <div class="access-area">

    <button
      id="password-toggle"
      class="password-toggle"
      type="button"
      aria-expanded="false"
      aria-controls="password-panel">

      EARLY ACCESS
      <span class="toggle-mark">+</span>

    </button>

    <div
      id="password-panel"
      class="password-panel"
      hidden>

      <p>Have an access password?</p>

      <form id="access-form" novalidate>

        <label class="sr-only" for="password">
          Access password
        </label>

        <input
          id="password"
          name="password"
          type="password"
          placeholder="ENTER PASSWORD"
          autocomplete="current-password"
          required>

        <button class="access-submit" type="submit">
          UNLOCK
        </button>

      </form>

      <p
        id="access-status"
        class="status"
        role="status"
        aria-live="polite">
      </p>

    </div>

  </div>

  <footer class="footer">
    <span>AYKAY®</span>
  </footer>

</section>
</main>

<script src="/app.js" defer></script>

</body>
</html>
