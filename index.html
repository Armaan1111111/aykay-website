
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="AYKAY — First Drop 001">
  <title>aykay — First Drop 001</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="page-shell">
    <section class="landing" aria-labelledby="brand-name">

      <div class="topline">
        <span>FIRST DROP 001</span>
      </div>

      <div class="brand-area">
        <h1 id="brand-name" class="embroidered">aykay</h1>
      </div>

      <form id="signup-form" class="signup-form" novalidate>
        <label class="sr-only" for="email">Email address</label>
        <input id="email" name="email" type="email"
          autocomplete="email" placeholder="EMAIL ADDRESS"
          maxlength="254" required>

        <div class="consent-row">
          <input id="consent" name="consent"
            type="checkbox" required>
          <label for="consent">
            I agree to receive AYKAY launch updates by email.
            I can unsubscribe at any time.
          </label>
        </div>

        <input class="website-field" type="text"
          name="website" tabindex="-1"
          autocomplete="off" aria-hidden="true">

        <button class="submit-button" type="submit">
          <span>JOIN THE LIST</span>
        </button>

        <p id="signup-status" class="status"
          role="status" aria-live="polite"></p>
      </form>

      <div class="access-area">
        <button id="password-toggle" class="password-toggle"
          type="button" aria-expanded="false"
          aria-controls="password-panel">
          <span>EARLY ACCESS</span>
          <span class="toggle-mark">+</span>
        </button>

        <div id="password-panel" class="password-panel" hidden>
          <p>Have an access password?</p>
          <form id="access-form" novalidate>
            <label class="sr-only" for="password">
              Access password
            </label>
            <input id="password" name="password"
              type="password" placeholder="ENTER PASSWORD"
              autocomplete="current-password" required>
            <button class="access-submit" type="submit">
              UNLOCK
            </button>
          </form>
          <p id="access-status" class="status"
            role="status" aria-live="polite"></p>
        </div>
      </div>

      <footer class="footer">
        <span>AYKAY®</span>
        <span>EST. 2026</span>
        <a href="/privacy.html">PRIVACY</a>
      </footer>

    </section>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
