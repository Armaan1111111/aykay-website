
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050505">
<title>AYKAY — First Drop 001</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  background: #050505;
}

body {
  color: #fff;
  font-family: Arial, sans-serif;
}

.page-shell {
  min-height: 100vh;
  min-height: 100svh;
  padding: 25px 22px;
  display: flex;
  justify-content: center;
}

.landing {
  width: 100%;
  max-width: 520px;
  min-height: calc(100svh - 50px);
  display: flex;
  flex-direction: column;
  align-items: center;
}

.topline {
  padding-top: 8px;
  color: #aaa;
  font: 10px monospace;
  letter-spacing: 4px;
}

.brand-area {
  width: 100%;
  margin-top: auto;
  margin-bottom: 38px;
  text-align: center;
}

.logo-stack {
  position: relative;
  width: 100%;
  height: 180px;
}

.logo-background {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  color: #172b46;
  font: 700 clamp(55px, 15vw, 90px)/1 Arial, sans-serif;
  letter-spacing: 5px;
  white-space: nowrap;
  opacity: .8;
}

.thread-logo {
  position: absolute;
  z-index: 2;
  top: 38px;
  left: 50%;
  transform: translateX(-50%);
  width: min(100%, 520px);
  overflow: visible;
}

.thread {
  fill: none;
  stroke: #83b5ff;
  stroke-width: 3.2;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: 3 4;
  filter: drop-shadow(0 0 2px #477fc9);
}

.signup-intro {
  max-width: 340px;
  color: #ddd;
  font: 11px/1.8 monospace;
  letter-spacing: 2px;
  text-align: center;
  margin: 0 0 20px;
}

.signup-form {
  width: 100%;
  max-width: 340px;
  display: flex;
  flex-direction: column;
  gap: 15px;
  margin-bottom: auto;
}

.signup-form input[type="email"],
.password-panel input {
  height: 48px;
  width: 100%;
  padding: 0 15px;
  background: transparent;
  border: 1px solid #333;
  color: white;
  font: 11px monospace;
  letter-spacing: 2px;
  outline: none;
}

.signup-form input::placeholder,
.password-panel input::placeholder {
  color: #777;
}

.signup-form input:focus,
.password-panel input:focus {
  border-color: #888;
}

.consent-row {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  color: #777;
  font-size: 10px;
  line-height: 1.6;
}

.consent-row input {
  margin-top: 2px;
  accent-color: #e5cc39;
}

.submit-button {
  height: 48px;
  background: #e5cc39;
  border: 0;
  color: #050505;
  font: 700 11px monospace;
  letter-spacing: 3px;
  cursor: pointer;
}

.submit-button:hover {
  background: #f3dc55;
}

.status {
  color: #aaa;
  font-size: 11px;
  text-align: center;
}

.website-field,
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0,0,0,0);
}

.access-area {
  width: 100%;
  max-width: 340px;
  margin-top: 30px;
  text-align: center;
}

.password-toggle {
  background: none;
  border: 0;
  color: #777;
  font: 10px monospace;
  letter-spacing: 3px;
  cursor: pointer;
}

.toggle-mark {
  margin-left: 12px;
}

.password-panel {
  margin-top: 20px;
}

.password-panel p {
  color: #888;
  font-size: 11px;
}

.password-panel form {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.access-submit {
  height: 42px;
  background: transparent;
  border: 1px solid #444;
  color: white;
  font: 11px monospace;
  letter-spacing: 2px;
  cursor: pointer;
}

.footer {
  width: 100%;
  display: flex;
  justify-content: space-between;
  margin-top: 35px;
  padding-top: 25px;
  color: #555;
  font: 9px monospace;
  letter-spacing: 2px;
}

.footer a {
  color: #555;
  text-decoration: none;
}

[hidden] { display: none !important; }

@media (max-height: 650px) {
  .brand-area { margin-bottom: 22px; }
}
</style>
</head>

<body>
<main class="page-shell">
<section class="landing">

  <div class="topline">FIRST DROP 001</div>

  <div class="brand-area">
    <div class="logo-stack">

      <span class="logo-background">AYKAY</span>

      <svg class="thread-logo"
        viewBox="0 0 540 150"
        role="img"
        aria-label="aykay">

        <g class="thread">

          <!-- First single-storey a: closed bowl and tall stem -->
          <path d="
            M84 63
            C84 43 69 29 51 29
            C31 29 18 44 18 64
            C18 84 31 99 51 99
            C69 99 84 84 84 64
          "/>
          <path d="M84 64 L84 17"/>

          <!-- y -->
          <path d="M119 46 L143 96"/>
          <path d="M167 46 L143 96
            C136 112 127 119 113 112"/>

          <!-- k -->
          <path d="M211 20 L211 101"/>
          <path d="M212 70 L247 45"/>
          <path d="M214 69 L249 101"/>

          <!-- Second single-storey a -->
          <path d="
            M335 63
            C335 43 320 29 302 29
            C282 29 269 44 269 64
            C269 84 282 99 302 99
            C320 99 335 84 335 64
          "/>
          <path d="M335 64 L335 17"/>

          <!-- Final y -->
          <path d="M370 46 L394 96"/>
          <path d="M418 46 L394 96
            C387 112 378 119 364 112"/>

          <!-- Loose thread trailing off the right -->
          <path d="
            M429 89
            C449 106 463 111 475 97
            C489 81 475 66 463 77
            C450 89 468 109 486 104
            C504 99 514 82 526 91
            C538 100 531 116 548 122
          "/>

        </g>
      </svg>

    </div>
  </div>

  <p class="signup-intro">
    SIGN UP TO NOT MISS THE BIG 99% DISCOUNT DROP.
  </p>

  <form id="signup-form" class="signup-form" novalidate>
    <label class="sr-only" for="email">Email address</label>
    <input id="email" name="email" type="email"
      autocomplete="email"
      placeholder="EMAIL ADDRESS"
      maxlength="254" required>

    <div class="consent-row">
      <input id="consent" name="consent"
        type="checkbox" required>
      <label for="consent">
        I agree to receive AYKAY launch updates by email.
        I can unsubscribe at any time.
      </label>
    </div>

    <input class="website-field" type="text"
      name="website" tabindex="-1"
      autocomplete="off" aria-hidden="true">

    <button class="submit-button" type="submit">
      JOIN THE LIST
    </button>

    <p id="signup-status" class="status"
      role="status" aria-live="polite"></p>
  </form>

  <div class="access-area">
    <button id="password-toggle"
      class="password-toggle"
      type="button"
      aria-expanded="false"
      aria-controls="password-panel">
      EARLY ACCESS <span class="toggle-mark">+</span>
    </button>

    <div id="password-panel" class="password-panel" hidden>
      <p>Have an access password?</p>

      <form id="access-form" novalidate>
        <label class="sr-only" for="password">
          Access password
        </label>
        <input id="password" name="password"
          type="password"
          placeholder="ENTER PASSWORD"
          autocomplete="current-password" required>

        <button class="access-submit" type="submit">
          UNLOCK
        </button>
      </form>

      <p id="access-status" class="status"
        role="status" aria-live="polite"></p>
    </div>
  </div>

  <footer class="footer">
    <span>AYKAY®</span>
    <span>EST. 2026</span>
    <a href="/privacy.html">PRIVACY</a>
  </footer>

</section>
</main>

<script src="/app.js" defer></script>
</body>
</html>
