
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050505">
<title>aykay — First Drop 001</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  background: #050505;
}

body {
  color: #fff;
  font-family: Arial, sans-serif;
}

.page-shell {
  min-height: 100vh;
  min-height: 100svh;
  padding: 25px 22px;
  display: flex;
  justify-content: center;
}

.landing {
  width: 100%;
  max-width: 520px;
  min-height: calc(100svh - 50px);
  display: flex;
  flex-direction: column;
  align-items: center;
}

.topline {
  padding-top: 8px;
  color: #aaa;
  font: 10px monospace;
  letter-spacing: 4px;
}

.brand-area {
  width: 100%;
  margin-top: auto;
  margin-bottom: 45px;
  text-align: center;
  overflow: visible;
}

.logo-stack {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 125px;
  width: 100%;
}

.logo-background {
  position: absolute;
  color: #172b46;
  font: 700 clamp(55px, 15vw, 90px) Arial, sans-serif;
  letter-spacing: 5px;
  white-space: nowrap;
  opacity: .85;
}

.thread-logo {
  position: relative;
  z-index: 2;
  width: min(100%, 440px);
  overflow: visible;
}

.thread {
  fill: none;
  stroke: #83b5ff;
  stroke-width: 3.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: 4 5;
  filter: drop-shadow(0 0 2px #477fc9);
}

.signup-intro {
  color: #aaa;
  font: 10px monospace;
  letter-spacing: 3px;
  text-align: center;
  margin: 0 0 18px;
}

.signup-form {
  width: 100%;
  max-width: 340px;
  display: flex;
  flex-direction: column;
  gap: 15px;
  margin-bottom: auto;
}

.signup-form input[type="email"],
.password-panel input {
  height: 48px;
  width: 100%;
  padding: 0 15px;
  background: transparent;
  border: 1px solid #333;
  color: white;
  font: 11px monospace;
  letter-spacing: 2px;
  outline: none;
}

.signup-form input::placeholder,
.password-panel input::placeholder {
  color: #777;
}

.signup-form input:focus,
.password-panel input:focus {
  border-color: #888;
}

.consent-row {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  color: #777;
  font-size: 10px;
  line-height: 1.6;
}

.consent-row input {
  margin-top: 2px;
  accent-color: #e5cc39;
}

.submit-button {
  height: 48px;
  background: #e5cc39;
  border: 0;
  color: #050505;
  font: 700 11px monospace;
  letter-spacing: 3px;
  cursor: pointer;
}

.submit-button:hover {
  background: #f3dc55;
}

.status {
  color: #aaa;
  font-size: 11px;
  text-align: center;
}

.website-field,
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0,0,0,0);
}

.access-area {
  width: 100%;
  max-width: 340px;
  margin-top: 30px;
  text-align: center;
}

.password-toggle {
  background: none;
  border: 0;
  color: #777;
  font: 10px monospace;
  letter-spacing: 3px;
  cursor: pointer;
}

.toggle-mark {
  margin-left: 12px;
}

.password-panel {
  margin-top: 20px;
}

.password-panel p {
  color: #888;
  font-size: 11px;
}

.password-panel form {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.access-submit {
  height: 42px;
  background: transparent;
  border: 1px solid #444;
  color: white;
  font: 11px monospace;
  letter-spacing: 2px;
}

.footer {
  width: 100%;
  display: flex;
  justify-content: space-between;
  margin-top: 35px;
  padding-top: 25px;
  color: #555;
  font: 9px monospace;
  letter-spacing: 2px;
}

.footer a {
  color: #555;
  text-decoration: none;
}

[hidden] {
  display: none !important;
}

@media (max-height: 650px) {
  .brand-area { margin-bottom: 25px; }
}
</style>
</head>

<body>
<main class="page-shell">
<section class="landing">

  <div class="topline">FIRST DROP 001</div>

  <div class="brand-area">
    <div class="logo-stack">

      <span class="logo-background">AYKAY</span>

      <svg class="thread-logo"
        viewBox="0 0 440 130"
        role="img"
        aria-label="aykay">

        <g class="thread">

          <!-- First lowercase a -->
          <path d="
            M52 65
            C52 44 20 39 14 61
            C7 87 43 96 52 72
            C56 61 51 49 51 44
            M52 44 L52 86
          "/>

          <!-- y -->
          <path d="
            M79 45 L94 81
            M109 45 L89 101
            C85 111 77 113 71 108
          "/>

          <!-- k -->
          <path d="
            M139 27 L139 87
            M140 66 L169 44
            M143 65 L171 88
          "/>

          <!-- Second lowercase a -->
          <path d="
            M220 65
            C220 44 188 39 182 61
            C175 87 211 96 220 72
            C224 61 219 49 219 44
            M220 44 L220 86
          "/>

          <!-- Final y -->
          <path d="
            M247 45 L262 81
            M277 45 L257 101
            C253 111 245 113 239 108
          "/>

          <!-- Loose thread trailing off the page -->
          <path d="
            M284 80
            C310 103 322 112 339 94
            C356 75 338 60 326 75
            C313 91 335 112 354 101
            C373 90 385 73 402 82
            C416 90 411 111 432 115
          "/>

        </g>
      </svg>

    </div>
  </div>

  <p class="signup-intro">BE FIRST TO THE DROP.</p>

  <form id="signup-form" class="signup-form" novalidate>

    <label class="sr-only" for="email">Email address</label>
    <input id="email" name="email" type="email"
      autocomplete="email"
      placeholder="EMAIL ADDRESS"
      maxlength="254" required>

    <div class="consent-row">
      <input id="consent" name="consent"
        type="checkbox" required>
      <label for="consent">
        I agree to receive AYKAY launch updates by email.
        I can unsubscribe at any time.
      </label>
    </div>

    <input class="website-field" type="text"
      name="website" tabindex="-1"
      autocomplete="off" aria-hidden="true">

    <button class="submit-button" type="submit">
      JOIN THE LIST
    </button>

    <p id="signup-status" class="status"
      role="status" aria-live="polite"></p>
  </form>

  <div class="access-area">
    <button id="password-toggle"
      class="password-toggle"
      type="button"
      aria-expanded="false"
      aria-controls="password-panel">
      EARLY ACCESS <span class="toggle-mark">+</span>
    </button>

    <div id="password-panel" class="password-panel" hidden>
      <p>Have an access password?</p>

      <form id="access-form" novalidate>
        <label class="sr-only" for="password">
          Access password
        </label>

        <input id="password" name="password"
          type="password"
          placeholder="ENTER PASSWORD"
          autocomplete="current-password" required>

        <button class="access-submit" type="submit">
          UNLOCK
        </button>
      </form>

      <p id="access-status" class="status"
        role="status" aria-live="polite"></p>
    </div>
  </div>

  <footer class="footer">
    <span>AYKAY®</span>
    <span>EST. 2026</span>
    <a href="/privacy.html">PRIVACY</a>
  </footer>

</section>
</main>

<script src="/app.js" defer></script>
</body>
</html>
